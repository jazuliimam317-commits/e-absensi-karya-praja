<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABSENSI QR - SMAS KARYA PRAJA</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 15px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    h2, h3 {
      text-align: center;
      color: #174b2b;
    }

    label {
      display: block;
      margin-top: 13px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: none;
      border-radius: 6px;
      color: white;
      background: #16803c;
      font-size: 16px;
      cursor: pointer;
    }

    #stop {
      background: #c62828;
    }

    #lanjut {
      background: #1565c0;
    }

    #reader {
      width: 100%;
      margin: 15px auto;
    }

    #hasil {
      margin-top: 15px;
      padding: 13px;
      background: #eef5ee;
      border-radius: 6px;
      overflow-wrap: anywhere;
      text-align: center;
    }
  </style>
</head>

<body>
<div class="container">

  <h2>ABSENSI QR</h2>
  <h3>SMAS KARYA PRAJA</h3>

  <label>PIN PETUGAS</label>
  <input
    type="password"
    id="pin"
    inputmode="numeric"
    placeholder="Masukkan PIN petugas"
  >

  <label>NAMA GURU / PETUGAS PIKET</label>
  <input
    type="text"
    id="petugas"
    placeholder="Masukkan nama petugas"
  >

  <label>STATUS KEHADIRAN</label>
  <select id="status">
    <option value="HADIR">HADIR</option>
    <option value="TERLAMBAT">TERLAMBAT</option>
    <option value="IZIN">IZIN</option>
    <option value="SAKIT">SAKIT</option>
    <option value="ALPA">ALPA</option>
    <option value="PULANG">PULANG</option>
    <option value="DINAS">DINAS</option>
  </select>

  <button onclick="mulaiScan()">AKTIFKAN KAMERA</button>
  <button id="stop" onclick="hentikanScan()">MATIKAN KAMERA</button>
  <button id="lanjut" onclick="scanLagi()" style="display:none">
    SCAN BERIKUTNYA
  </button>

  <div id="reader"></div>
<h3>REKAP KEHADIRAN HARI INI</h3>

<div id="rekap">
  <p>Memuat rekap...</p>
</div>
  <h3>HASIL ABSENSI</h3>
  <div id="hasil">Siap melakukan pemindaian QR.</div>

</div>

<script>
const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbzHcBAnuWQKkpFDg0MRPn019gDyyU_Yue3vOqlUMT7rC_rDy4lraLXnCOObYSYX8Kek/exec";

let scanner = null;
let berjalan = false;
let sedangMulai = false;
let sedangProses = false;

function tampilkan(pesan) {
  document.getElementById("hasil").innerText = pesan;
}

function mulaiScan() {

  if (berjalan || sedangMulai) return;

  if (!document.getElementById("pin").value.trim()) {
    alert("Masukkan PIN petugas terlebih dahulu.");
    return;
  }

  if (!document.getElementById("petugas").value.trim()) {
    alert("Masukkan nama petugas terlebih dahulu.");
    return;
  }

  sedangMulai = true;
  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 250 } },

    function(decodedText) {
      if (sedangProses) return;

      sedangProses = true;
      scanner.pause(true);

      kirimAbsensi(decodedText);
    },

    function(errorMessage) {}

  ).then(function() {
    berjalan = true;
    sedangMulai = false;
    tampilkan("Kamera aktif. Silakan pindai QR.");
  }).catch(function(error) {
    sedangMulai = false;
    tampilkan("Kamera gagal dibuka: " + error);
  });
}

async function kirimAbsensi(qrText) {

  tampilkan("QR terbaca: " + qrText + "\nMengirim data absensi...");

  const data = {
    pin: document.getElementById("pin").value.trim(),
    qrText: qrText,
    status: document.getElementById("status").value,
    namaPetugas: document.getElementById("petugas").value.trim()
  };

  try {

    const response = await fetch(URL_APPS_SCRIPT, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(data)
    });

    if (!response.ok) {
      throw new Error("Server memberikan respons " + response.status);
    }

    const hasil = await response.json();

    if (hasil.ok) {
      tampilkan(
        "BERHASIL DISIMPAN\n\n" +
        "Nama: " + hasil.nama + "\n" +
        "ID: " + qrText + "\n" +
        "Jenis: " + hasil.jenis + "\n" +
        "Kelompok: " + hasil.kelompok + "\n" +
        "Status: " + hasil.status + "\n" +
        "Jam: " + hasil.jam
      );
    } else {
      tampilkan("ABSENSI DITOLAK\n\n" + hasil.message);
    }

  } catch (error) {

    tampilkan(
      "GAGAL MENGHUBUNGI SERVER\n\n" +
      error.message +
      "\n\nPeriksa koneksi dan konfigurasi Web App."
    );

  }

  document.getElementById("lanjut").style.display = "block";
  sedangProses = false;
}

function scanLagi() {

  if (scanner && berjalan) {
    document.getElementById("lanjut").style.display = "none";
    sedangProses = false;
    scanner.resume();
    tampilkan("Silakan pindai QR berikutnya.");
  }

}

function hentikanScan() {

  if (scanner && berjalan) {
    scanner.stop().then(function() {
      scanner.clear();
      berjalan = false;
      sedangProses = false;
      tampilkan("Kamera sudah dimatikan.");
    }).catch(function(error) {
      tampilkan("Gagal mematikan kamera: " + error);
    });
  }

}
  async function muatRekap() {
  const tempat = document.getElementById("rekap");

  try {
    const response = await fetch(URL_APPS_SCRIPT, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: "REKAP"
      })
    });

    if (!response.ok) {
      throw new Error("Gagal mengambil data rekap.");
    }

    const data = await response.json();

    if (!data.ok) {
      throw new Error("Data rekap tidak tersedia.");
    }

    let rincian = "";

    Object.entries(data.status).forEach(([nama, jumlah]) => {
      rincian += `<p>${nama}: <b>${jumlah}</b></p>`;
    });

    tempat.innerHTML = `
      <p>Jumlah Siswa: <b>${data.siswa}</b></p>
      <p>Jumlah Guru/Tendik: <b>${data.guru}</b></p>
      <p>Total Absensi: <b>${data.total}</b></p>
      <hr>
      <b>Rincian Status</b>
      ${rincian || "<p>Belum ada absensi hari ini.</p>"}
    `;

  } catch (error) {
    tempat.innerHTML = "Rekap belum dapat dimuat.";
  }
}

window.addEventListener("load", muatRekap);
</script>

</body>
</html>
